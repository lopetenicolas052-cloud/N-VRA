<style>

html{

body{

<script>

const SUPABASE_URL =
"https://aolvmuxronsqikvulvex.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rjZPtLmKS9HPJwux3lTcyQ_IO2bmUYk";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let products = [];

let orders = [];

let editingProduct = null;

let currentImageUrl = null;


/* UTILIDADES */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function showToast(message){

const toast =
document.getElementById("toast");

toast.textContent = message;

toast.style.display = "block";

clearTimeout(window.toastTimer);

window.toastTimer =
setTimeout(()=>{

toast.style.display="none";

},3000);

}


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async e=>{

e.preventDefault();

const error =
document.getElementById("loginError");

const button =
document.getElementById("loginBtn");

error.textContent = "";

button.disabled = true;

button.textContent = "ENTRANDO...";

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;


try{

const result =
await supabaseClient.auth.signInWithPassword({

email,
password

});


if(result.error){

throw result.error;

}

showAdmin();

}catch(err){

console.error(err);

error.textContent =
err.message ||
"No se pudo iniciar sesión.";

}finally{

button.disabled = false;

button.textContent = "ENTRAR";

}

});


async function checkSession(){

try{

const {data,error} =
await supabaseClient.auth.getSession();

if(error){

console.error(error);

return;

}

if(data.session){

showAdmin();

}

}catch(err){

console.error(err);

}

}


function showAdmin(){

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("adminApp")
.classList.remove("hidden");

loadProducts();

loadOrders();

}


document
.getElementById("logoutBtn")
.addEventListener(
"click",
async()=>{

await supabaseClient.auth.signOut();

location.reload();

});


checkSession();


/* TABS */

document
.querySelectorAll(".tab")
.forEach(tab=>{

tab.addEventListener(
"click",
()=>{

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

tab.classList.add("active");

document
.querySelectorAll(".section")
.forEach(x=>
x.classList.add("hidden")
);

document
.getElementById(tab.dataset.section)
.classList.remove("hidden");

});

});


/* BOTONES REFRESH */

document
.getElementById("refreshProductsBtn")
.addEventListener(
"click",
async()=>{

await loadProducts();

showToast("Productos actualizados.");

});


document
.getElementById("refreshOrdersBtn")
.addEventListener(
"click",
async()=>{

await loadOrders();

showToast("Pedidos actualizados.");

});


/* PRODUCTOS */

async function loadProducts(){

const grid =
document.getElementById("productsGrid");

grid.innerHTML =
'<div class="loading">Cargando productos...</div>';

try{

const {data,error} =
await supabaseClient

.from("products")

.select("*")

.order(
"created_at",
{ascending:false}
);


if(error){

throw error;

}

products = data || [];

renderProducts();

updateProductStats();

}catch(err){

console.error(err);

grid.innerHTML = `

<div class="empty">

No se pudieron cargar los productos.

<br><br>

${escapeHtml(err.message)}

</div>

`;

}

}


function getFilteredProducts(){

const search =
document
.getElementById("productSearch")
.value
.trim()
.toLowerCase();

const category =
document
.getElementById("categoryFilter")
.value;


return products.filter(product=>{

const matchesSearch =
!search ||

String(product.name || "")
.toLowerCase()
.includes(search) ||

String(product.description || "")
.toLowerCase()
.includes(search);


const matchesCategory =
category === "ALL" ||

String(product.category || "")
.toUpperCase() === category;


return matchesSearch &&
matchesCategory;

});

}


function renderProducts(){

const grid =
document.getElementById("productsGrid");

const list =
getFilteredProducts();


if(!list.length){

grid.innerHTML =
'<div class="empty">No se encontraron productos.</div>';

return;

}


grid.innerHTML =
list.map(product=>{

const stock =
Number(product.stock ?? 0);


let imageHtml = `

<div class="productNoImage">
SIN IMAGEN
</div>

`;


if(product.image){

imageHtml = `

<img

class="productImage"

src="${escapeHtml(product.image)}"

alt="${escapeHtml(product.name)}"

loading="lazy"

onerror="this.onerror=null;this.outerHTML='<div class=&quot;productNoImage&quot;>IMAGEN NO DISPONIBLE</div>'"

>

`;

}


let badges = "";


if(product.is_new){

badges +=
'<span class="badgeNew">NUEVO</span>';

}


if(product.is_sale){

badges +=
'<span class="badgeSale">OFERTA</span>';

}


return `

<div class="productCard">

${imageHtml}

<div class="productInfo">

<div class="productName">

${escapeHtml(product.name)}

</div>


<div class="productMeta">

${escapeHtml(product.category || "")}

<br>

Stock:

<span class="${
stock <= 0
? "stockOut"
: "stockGood"
}">

${stock}

</span>

/* PREPARAR IMAGEN */

async function prepareImage(file){

if(!file){

return null;

}


if(!file.type.startsWith("image/")){

throw new Error(
"El archivo seleccionado no es una imagen."
);

}


const maxSize = 1600;

let bitmap;

try{

bitmap =
await createImageBitmap(file);

}catch(err){

throw new Error(
"No se pudo leer la imagen."
);

}


let width =
bitmap.width;

let height =
bitmap.height;


if(
width > maxSize ||
height > maxSize
){

const ratio =
Math.min(
maxSize / width,
maxSize / height
);

width =
Math.round(width * ratio);

height =
Math.round(height * ratio);

}


const canvas =
document.createElement("canvas");

canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext("2d");

ctx.drawImage(
bitmap,
0,
0,
width,
height
);

bitmap.close();


const blob =
await new Promise(
resolve=>
canvas.toBlob(
resolve,
"image/jpeg",
0.88
)
);


if(!blob){

throw new Error(
"No se pudo preparar la imagen."
);

}


return blob;

}
/* SUBIR IMAGEN */

async function uploadProductImage(file){

if(!file){

return null;

}


const status =
document.getElementById("uploadStatus");


status.textContent =
"Preparando imagen...";


const blob =
await prepareImage(file);


const path =
"products/" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
".jpg";


status.textContent =
"Subiendo imagen...";


const result =
await supabaseClient

.storage

.from("product-images")

.upload(
path,
blob,
{
contentType:"image/jpeg",
cacheControl:"3600",
upsert:false
}
);


if(result.error){

console.error(
"ERROR STORAGE:",
result.error
);

throw new Error(

"No se pudo subir la imagen. " +

(
result.error.message ||
"Revisa Storage y sus políticas."
)

);

}


const publicResult =
supabaseClient

.storage

.from("product-images")

.getPublicUrl(path);


const publicUrl =
publicResult
?.data
?.publicUrl;


if(!publicUrl){

throw new Error(
"Supabase no devolvió la URL de la imagen."
);

}


status.textContent =
"Imagen subida correctamente.";

return publicUrl;

}

<script>

const SUPABASE_URL =
"https://aolvmuxronsqikvulvex.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rjZPtLmKS9HPJwux3lTcyQ_IO2bmUYk";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let products = [];
let editingProduct = null;
let orders = [];


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const error =
document.getElementById("loginError");

error.textContent="";

const {error:loginError} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(loginError){

error.textContent =
loginError.message;

return;

}

showAdmin();

});


async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){

showAdmin();

}

}


function showAdmin(){

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("adminApp")
.classList.remove("hidden");

loadProducts();

loadOrders();

}


document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await supabaseClient.auth.signOut();

location.reload();

});


checkSession();


/* TABS */

document
.querySelectorAll(".tab")
.forEach(tab=>{

tab.addEventListener("click",()=>{

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

tab.classList.add("active");

document
.querySelectorAll(".section")
.forEach(x=>
x.classList.add("hidden")
);

document
.getElementById(tab.dataset.section)
.classList.remove("hidden");

});

});


/* PRODUCTOS */

async function loadProducts(){

const {data,error} =
await supabaseClient
.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){

console.error(error);
return;

}

products=data || [];

renderProducts();

}


function renderProducts(){

const grid =
document.getElementById("productsGrid");

if(!products.length){

grid.innerHTML=`
<div style="
grid-column:1/-1;
padding:40px;
text-align:center;
color:#555;
">
No hay productos todavía.
</div>
`;

return;

}

grid.innerHTML =
products.map(product=>{

const image =
product.image
?
`<img
class="productImage"
src="${escapeHtml(product.image)}"
>`
:
`<div class="productNoImage">
SIN IMAGEN
</div>`;

return `

<div class="productCard">

${image}

<div class="productInfo">

<div class="productName">
${escapeHtml(product.name)}
</div>

<div class="productMeta">
${escapeHtml(product.category || "")}
<br>
Stock: ${product.stock ?? 0}
</div>

<div class="productPrice">

${Number(product.price).toFixed(2)}

${product.old_price
?
`<span class="productOldPrice">
${Number(product.old_price).toFixed(2)}
</span>`
:""}

</div>

<div class="productActions">

<button
class="smallBtn"
onclick="editProduct(${product.id})">
EDITAR
</button>

<button
class="smallBtn deleteBtn"
onclick="deleteProduct(${product.id})">
BORRAR
</button>

</div>

</div>

</div>

`;

}).join("");

}


function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>
<script>

/* MODAL PRODUCTO */

document
.getElementById("addProductBtn")
.addEventListener("click",()=>{

editingProduct=null;

document
.getElementById("productForm")
.reset();

document
.getElementById("productId")
.value="";

document
.getElementById("modalTitle")
.textContent="Añadir producto";

document
.getElementById("imagePreview")
.style.display="none";

document
.getElementById("productModal")
.classList.add("show");

});


document
.getElementById("closeProductModal")
.addEventListener("click",closeProductModal);


function closeProductModal(){

document
.getElementById("productModal")
.classList.remove("show");

}


document
.getElementById("productImageFile")
.addEventListener("change",e=>{

const file=e.target.files[0];

if(!file)return;

const url=
URL.createObjectURL(file);

document
.getElementById("previewImage")
.src=url;

document
.getElementById("imagePreview")
.style.display="block";

});


/* EDITAR */

window.editProduct=function(id){

const product =
products.find(x=>x.id===id);

if(!product)return;

editingProduct=product;

document
.getElementById("productId")
.value=product.id;

document
.getElementById("productName")
.value=product.name || "";

document
.getElementById("productDescription")
.value=product.description || "";

document
.getElementById("productPrice")
.value=product.price ?? "";

document
.getElementById("productOldPrice")
.value=product.old_price ?? "";

document
.getElementById("productCategory")
.value=product.category || "OTHER";

document
.getElementById("productStock")
.value=product.stock ?? 0;

document
.getElementById("productSizes")
.value=
Array.isArray(product.sizes)
?
product.sizes.join(",")
:
"";

document
.getElementById("productNew")
.checked=
!!product.is_new;

document
.getElementById("productSale")
.checked=
!!product.is_sale;

if(product.image){

document
.getElementById("previewImage")
.src=product.image;

document
.getElementById("imagePreview")
.style.display="block";

}else{

document
.getElementById("imagePreview")
.style.display="none";

}

document
.getElementById("modalTitle")
.textContent="Editar producto";

document
.getElementById("productModal")
.classList.add("show");

};


/* SUBIR IMAGEN */

async function uploadProductImage(file){

if(!file)return null;

const extension =
file.name.split(".").pop();

const path =
"products/"
+
Date.now()
+
"-"
+
Math.random()
.toString(36)
.substring(2)
+
"."
+
extension;

  const {data,error} =
await supabaseClient
.storage
.from("product-images")
.upload(path,file,{
upsert:false
});

if(error){
console.error("ERROR SUBIENDO IMAGEN:",error);
throw new Error("Error al subir imagen: " + error.message);
}
}

const {data} =
supabaseClient
.storage
.from("product-images")
.getPublicUrl(path);

return data.publicUrl;

}


/* GUARDAR */

document
.getElementById("productForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const errorBox =
document.getElementById("productError");

errorBox.textContent="";

try{

const file =
document
.getElementById("productImageFile")
.files[0];

let image =
editingProduct
?
editingProduct.image
:
null;

if(file){

image=
await uploadProductImage(file);

}

const sizes =
document
.getElementById("productSizes")
.value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

const payload={

name:
document.getElementById("productName").value.trim(),

description:
document.getElementById("productDescription").value.trim(),

price:
Number(document.getElementById("productPrice").value),

old_price:
Number(
document.getElementById("productOldPrice").value
) || null,

category:
document.getElementById("productCategory").value,

sizes,

stock:
Number(
document.getElementById("productStock").value
) || 0,

is_new:
document.getElementById("productNew").checked,

is_sale:
document.getElementById("productSale").checked,

image

};

if(editingProduct){

const {error} =
await supabaseClient
.from("products")
.update(payload)
.eq("id",editingProduct.id);

if(error)throw error;

}else{

const {error} =
await supabaseClient
.from("products")
.insert(payload);

if(error)throw error;

}

closeProductModal();

await loadProducts();

}catch(err){

console.error(err);

errorBox.textContent =
err.message || "Error al guardar.";

}

});


/* BORRAR */

window.deleteProduct=async function(id){

const product =
products.find(x=>x.id===id);

if(!product)return;

if(!confirm(
`¿Borrar "${product.name}"?`
))return;

const {error} =
await supabaseClient
.from("products")
.delete()
.eq("id",id);

if(error){

alert(error.message);
return;

}

loadProducts();

}

  </script>
  <script>

/* PEDIDOS */

async function loadOrders(){

const {data,error} =
await supabaseClient
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(error){

console.error(error);
return;

}

orders=data || [];

await renderOrders();

}


async function getOrderItems(orderId){

const {data,error} =
await supabaseClient
.from("order_items")
.select("*")
.eq("order_id",orderId);

if(error){

console.error(error);
return [];

}

return data || [];

}


async function renderOrders(){

const container =
document.getElementById("ordersList");

if(!orders.length){

container.innerHTML=`
<div style="
padding:40px;
text-align:center;
color:#555;
">
No hay pedidos todavía.
</div>
`;

return;

}

container.innerHTML="";

for(const order of orders){

const items =
await getOrderItems(order.id);

const productsText =
items.length
?
items.map(item=>
`
<div class="orderProduct">

<strong>
${escapeHtml(item.product_name)}
</strong>

<br>

Talla:
${escapeHtml(item.size || "—")}

&nbsp; | &nbsp;

Cantidad:
${item.quantity}

&nbsp; | &nbsp;

${Number(item.price).toFixed(2)}

</div>
`
).join("")
:
`
<div class="orderProduct">
Sin productos registrados
</div>
`;

const card =
document.createElement("div");

card.className="orderCard";

card.innerHTML=`

<div class="orderTop">

<div>

<div class="orderNumber">
${escapeHtml(order.order_number)}
</div>

<div class="orderDate">
${new Date(order.created_at)
.toLocaleString()}
</div>

</div>

<div class="statusBadge">
${escapeHtml(order.order_status || "new")}
</div>

</div>


<div class="orderCustomer">

<strong>Cliente:</strong>
${escapeHtml(order.customer_name)}

<br>

<strong>Teléfono:</strong>
${escapeHtml(order.customer_phone || "—")}

window.updateOrderStatus=
async function(id,status){

const {error} =
await supabaseClient
.from("orders")
.update({
order_status:status
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

await loadOrders();

};


/* ESTADO PAGO */

window.updatePaymentStatus=
async function(id,status){

const {error} =
await supabaseClient
.from("orders")
.update({
payment_status:status
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

const order =
orders.find(x=>x.id===id);

if(order){

order.payment_status=status;

}

alert("Estado del pago actualizado.");

};

/* ACTUALIZACIÓN EN TIEMPO REAL */

supabaseClient
.channel("novra-admin")

table:"products"
},
()=>{
loadProducts();
}
)
.on(

},

}
)

"postgres_changes",
{
event:"UPDATE",
schema:"public",

},
()=>{

}
)
.subscribe();

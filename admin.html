<script>

const SUPABASE_URL=
"https://aolvmuxronsqikvulvex.supabase.co";

const SUPABASE_KEY=
"sb_publishable_rjZPtLmKS9HPJwux3lTcyQ_IO2bmUYk";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let products=[];

let editingProduct=null;

let orders=[];


function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function showToast(message){

const t=
document.getElementById("toast");

t.textContent=message;

t.style.display="block";

setTimeout(
()=>t.style.display="none",
3000
);

}


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async e=>{

e.preventDefault();

const error=
document.getElementById("loginError");

error.textContent="";

const email=
document
.getElementById("loginEmail")
.value
.trim();

const password=
document
.getElementById("loginPassword")
.value;


const {error:loginError}=
await supabaseClient.auth
.signInWithPassword({
email,
password
});


if(loginError){

error.textContent=
loginError.message;

return;

}

showAdmin();

});


async function checkSession(){

const {data}=
await supabaseClient.auth
.getSession();

if(data.session)
showAdmin();

}


function showAdmin(){

document
.getElementById("loginScreen")
.classList
.add("hidden");

document
.getElementById("adminApp")
.classList
.remove("hidden");

loadProducts();

loadOrders();

}


document
.getElementById("logoutBtn")
.addEventListener(
"click",
async()=>{

await supabaseClient.auth.signOut();

location.reload();

});


checkSession();


/* TABS */

document
.querySelectorAll(".tab")
.forEach(tab=>{

tab.addEventListener(
"click",
()=>{

document
.querySelectorAll(".tab")
.forEach(
x=>x.classList.remove("active")
);

tab.classList.add("active");

document
.querySelectorAll(".section")
.forEach(
x=>x.classList.add("hidden")
);

document
.getElementById(tab.dataset.section)
.classList
.remove("hidden");

});

});


/* PRODUCTOS */

async function loadProducts(){

const {data,error}=
await supabaseClient
.from("products")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(error){

console.error(error);

return;

}


products=data || [];

renderProducts();

}


function renderProducts(){

const grid=
document.getElementById(
"productsGrid"
);


if(!products.length){

grid.innerHTML=
'<div style="grid-column:1/-1;padding:40px;text-align:center;color:#555">No hay productos todavía.</div>';

return;

}


grid.innerHTML=
products.map(product=>{

const image=
product.image
?
`<img class="productImage" src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}">`
:
`<div class="productNoImage">SIN IMAGEN</div>`;


const stock=
Number(product.stock ?? 0);


return `

<div class="productCard">

${image}

<div class="productInfo">

<div class="productName">
${escapeHtml(product.name)}
</div>

<div class="productMeta">

${escapeHtml(product.category || "")}
<br>

Stock:

<span
class="${stock<=0?"stockOut":""}"
>
${stock}
</span>

${stock<=0 ? " — AGOTADO" : ""}

</div>

<div class="productPrice">

${Number(product.price).toFixed(2)}

${
product.old_price
?
`<span class="productOldPrice">
${Number(product.old_price).toFixed(2)}
</span>`
:
""
}

</div>

<div class="productActions">

<button
class="smallBtn"
onclick="editProduct(${product.id})"
>
EDITAR
</button>

<button
class="smallBtn deleteBtn"
onclick="deleteProduct(${product.id})"
>
BORRAR
</button>

</div>

</div>

</div>

`;

}).join("");

}


/* MODAL PRODUCTO */

document
.getElementById("addProductBtn")
.addEventListener(
"click",
()=>{

editingProduct=null;

document
.getElementById("productForm")
.reset();

document
.getElementById("productId")
.value="";

document
.getElementById("modalTitle")
.textContent=
"Añadir producto";

document
.getElementById("imagePreview")
.style.display="none";

document
.getElementById("uploadStatus")
.textContent="";

document
.getElementById("productError")
.textContent="";

document
.getElementById("productModal")
.classList
.add("show");

});


document
.getElementById("closeProductModal")
.addEventListener(
"click",
closeProductModal
);


function closeProductModal(){

document
.getElementById("productModal")
.classList
.remove("show");

}


document
.getElementById("productImageFile")
.addEventListener(
"change",
e=>{

const file=
e.target.files[0];

if(!file)
return;


if(!file.type.startsWith("image/")){

document
.getElementById("productError")
.textContent=
"Selecciona una imagen válida.";

e.target.value="";

return;

}


const url=
URL.createObjectURL(file);


document
.getElementById("previewImage")
.src=url;

document
.getElementById("imagePreview")
.style.display="block";

document
.getElementById("uploadStatus")
.textContent=
"Imagen seleccionada: "+file.name;

});


/* EDITAR */

window.editProduct=
function(id){

const product=
products.find(
x=>x.id===id
);

if(!product)
return;


editingProduct=product;


document
.getElementById("productId")
.value=
product.id;

document
.getElementById("productName")
.value=
product.name || "";

document
.getElementById("productDescription")
.value=
product.description || "";

document
.getElementById("productPrice")
.value=
product.price ?? "";

document
.getElementById("productOldPrice")
.value=
product.old_price ?? "";

document
.getElementById("productCategory")
.value=
product.category || "OTHER";

document
.getElementById("productStock")
.value=
product.stock ?? 0;

document
.getElementById("productSizes")
.value=
Array.isArray(product.sizes)
?
product.sizes.join(",")
:
"";

document
.getElementById("productNew")
.checked=
!!product.is_new;

document
.getElementById("productSale")
.checked=
!!product.is_sale;

document
.getElementById("productError")
.textContent="";

document
.getElementById("uploadStatus")
.textContent="";


if(product.image){

document
.getElementById("previewImage")
.src=
product.image;

document
.getElementById("imagePreview")
.style.display=
"block";

}else{

document
.getElementById("imagePreview")
.style.display=
"none";

}


document
.getElementById("modalTitle")
.textContent=
"Editar producto";

document
.getElementById("productModal")
.classList
.add("show");

};


/* SUBIR IMAGEN */

async function prepareImage(file){

if(!file)
return null;


if(!file.type.startsWith("image/")){

throw new Error(
"El archivo seleccionado no es una imagen."
);

}


const maxSize=1600;


const bitmap=
await createImageBitmap(file);


let width=bitmap.width;

let height=bitmap.height;


if(
width>maxSize ||
height>maxSize
){

const ratio=
Math.min(
maxSize/width,
maxSize/height
);

width=
Math.round(
width*ratio
);

height=
Math.round(
height*ratio
);

}


const canvas=
document.createElement("canvas");

canvas.width=width;

canvas.height=height;


const ctx=
canvas.getContext("2d");

ctx.drawImage(
bitmap,
0,
0,
width,
height
);

bitmap.close();


const blob=
await new Promise(
resolve=>{
canvas.toBlob(
resolve,
"image/jpeg",
0.88
);
}
);


if(!blob){

throw new Error(
"No se pudo preparar la imagen."
);

}


return blob;

}


async function uploadProductImage(file){

if(!file)
return null;


const status=
document.getElementById(
"uploadStatus"
);

status.textContent=
"Preparando imagen...";


const blob=
await prepareImage(file);


const path=
"products/"
+
Date.now()
+
"-"
+
Math.random()
.toString(36)
.substring(2)
+
".jpg";


status.textContent=
"Subiendo imagen...";


const {error}=
await supabaseClient
.storage
.from("product-images")
.upload(
path,
blob,
{
contentType:"image/jpeg",
cacheControl:"3600",
upsert:false
}
);


if(error){

console.error(
"ERROR STORAGE:",
error
);

throw new Error(
"No se pudo subir la imagen. "
+
(error.message ||
"Revisa Storage y las políticas.")
);

}


const {data}=
supabaseClient
.storage
.from("product-images")
.getPublicUrl(path);


if(
!data ||
!data.publicUrl
){

throw new Error(
"Supabase no devolvió la URL de la imagen."
);

}


status.textContent=
"Imagen subida correctamente.";

return data.publicUrl;

}


/* GUARDAR PRODUCTO */

document
.getElementById("productForm")
.addEventListener(
"submit",
async e=>{

e.preventDefault();


const errorBox=
document.getElementById(
"productError"
);

const saveBtn=
document.getElementById(
"saveProductBtn"
);


errorBox.textContent="";

saveBtn.disabled=true;

saveBtn.textContent=
"GUARDANDO...";


try{

const file=
document
.getElementById("productImageFile")
.files[0];


let image=
editingProduct
?
editingProduct.image
:
null;


if(file){

image=
await uploadProductImage(file);

}


const sizes=
document
.getElementById("productSizes")
.value
.split(",")
.map(x=>x.trim())
.filter(Boolean);


const payload={

name:
document
.getElementById("productName")
.value
.trim(),

description:
document
.getElementById("productDescription")
.value
.trim(),

price:
Number(
document
.getElementById("productPrice")
.value
),

old_price:
Number(
document
.getElementById("productOldPrice")
.value
)
||
null,

category:
document
.getElementById("productCategory")
.value,

sizes,

stock:
Number(
document
.getElementById("productStock")
.value
)
||
0,

is_new:
document
.getElementById("productNew")
.checked,

is_sale:
document
.getElementById("productSale")
.checked,

image

};


if(!payload.name){

throw new Error(
"Escribe el nombre del producto."
);

}


if(
!Number.isFinite(payload.price)
){

throw new Error(
"Introduce un precio válido."
);

}


if(editingProduct){

const {error}=
await supabaseClient
.from("products")
.update(payload)
.eq(
"id",
editingProduct.id
);


if(error)
throw error;

}else{

const {error}=
await supabaseClient
.from("products")
.insert(payload);


if(error)
throw error;

}


closeProductModal();

await loadProducts();

showToast(
editingProduct
?
"Producto actualizado."
:
"Producto publicado."
);


}catch(err){

console.error(err);

errorBox.textContent=
err.message ||
"Error al guardar.";

}finally{

saveBtn.disabled=false;

saveBtn.textContent=
"GUARDAR PRODUCTO";

}

});


/* BORRAR */

window.deleteProduct=
async function(id){

const product=
products.find(
x=>x.id===id
);

if(!product)
return;


if(
!confirm(
`¿Borrar "${product.name}"?`
)
)
return;


const {error}=
await supabaseClient
.from("products")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


await loadProducts();

showToast(
"Producto borrado."
);

};

<script>

let currentProducts = [];
let currentOrders = [];
let selectedOrderId = null;


/* =========================
   TABS
========================= */

function openTab(tabId, button){

    document
        .querySelectorAll(".tab-content")
        .forEach(tab => {
            tab.classList.remove("active");
        });

    document
        .querySelectorAll(".tab-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    const tab = document.getElementById(tabId);

    if(tab){
        tab.classList.add("active");
    }

    if(button){
        button.classList.add("active");
    }

    if(tabId === "ordersTab"){
        loadOrders();
    }

    if(tabId === "productsTab"){
        loadProducts();
    }
}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast = document.getElementById("toast");

    if(!toast) return;

    toast.textContent = message;

    toast.style.transform = "translateY(0)";
    toast.style.opacity = "1";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {

        toast.style.transform = "translateY(100px)";
        toast.style.opacity = "0";

    },3000);
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   FORMATO PRECIO
========================= */

function formatPrice(value){

    const number = Number(value || 0);

    return number.toLocaleString("es-ES") + " XAF";
}


/* =========================
   FECHA
========================= */

function formatDate(date){

    if(!date){
        return "—";
    }

    try{

        return new Date(date).toLocaleString(
            "es-ES",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return date;

    }
}


/* =========================
   ESTADO
========================= */

function statusHTML(status){

    const value = String(status || "pending").toLowerCase();

    const names = {

        pending:"Pendiente",
        paid:"Pagado",
        processing:"Procesando",
        shipped:"Enviado",
        delivered:"Entregado",
        cancelled:"Cancelado"

    };

    const name = names[value] || value;

    return `
        <span class="status status-${escapeHTML(value)}">
            ${escapeHTML(name)}
        </span>
    `;
}

/* =========================
   PREVISUALIZACIÓN
========================= */

function previewProductImage(event){

    const file =
        event.target.files?.[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        const preview =
            document.getElementById("previewImage");

        const container =
            document.getElementById("imagePreview");

        if(preview){
            preview.src = e.target.result;
        }

        if(container){
            container.style.display = "block";
        }

    };

    reader.readAsDataURL(file);

}

<script>

async function uploadProductImage(file){

    if(!file){
        return null;
    }

    try{

        const extension =
            file.name.split(".").pop().toLowerCase();

        const fileName =
            "product-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8) +
            "." +
            extension;


        const filePath =
            fileName;


        const { error } =
            await supabase
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


        if(error){
            throw error;
        }


        const { data } =
            supabase
                .storage
                .from("product-images")
                .getPublicUrl(filePath);


        return data?.publicUrl || null;


    }catch(error){

        console.error(
            "Error subiendo imagen:",
            error
        );

        throw error;

    }

}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function saveProduct(){

    const id =
        document.getElementById("productId").value.trim();

    const name =
        document.getElementById("productName").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const price =
        Number(
            document.getElementById("productPrice").value
        );

    const stock =
        Number(
            document.getElementById("productStock").value
        );

    const category =
        document.getElementById("productCategory").value;

    const file =
        document.getElementById("productImage")
            .files?.[0];


    if(!name){

        showToast(
            "Introduce el nombre del producto"
        );

        return;
    }


    if(!Number.isFinite(price)){

        showToast(
            "Introduce un precio válido"
        );

        return;
    }


    if(!Number.isFinite(stock)){

        showToast(
            "Introduce el stock"
        );

        return;
    }


    const saveButton =
        document.querySelector(
            "#productModal .btn-primary"
        );


    if(saveButton){

        saveButton.disabled = true;

        saveButton.textContent =
            "Guardando...";

    }


    try{

        let imageUrl = null;


        /* Si se seleccionó una imagen */

        if(file){

            imageUrl =
                await uploadProductImage(file);

        }


        const productData = {

            name:name,

            description:description,

            price:price,

            stock:stock,

            category:category

        };


        if(imageUrl){

            productData.image_url =
                imageUrl;

        }


        let result;


        /* EDITAR */

        if(id){

            result =
                await supabase
                    .from("products")
                    .update(productData)
                    .eq("id",id);

        }


        /* NUEVO */

        else{

            result =
                await supabase
                    .from("products")
                    .insert(productData);

        }


        if(result.error){

            throw result.error;

        }


        closeProductForm();

        showToast(
            id
            ? "Producto actualizado"
            : "Producto creado"
        );


        await loadProducts();


    }catch(error){

        console.error(
            "Error guardando producto:",
            error
        );

        showToast(
            "Error: " +
            (error.message || "No se pudo guardar")
        );


    }finally{

        if(saveButton){

            saveButton.disabled = false;

            saveButton.textContent =
                "Guardar producto";

        }

    }

}


/* =========================
   ELIMINAR PRODUCTO
========================= */

async function deleteProduct(id){

    const product =
        currentProducts.find(
            item => String(item.id) === String(id)
        );


    if(!product){
        return;
    }


    const confirmed =
        confirm(
            `¿Eliminar "${product.name || product.title}"?`
        );


    if(!confirmed){
        return;
    }


    try{

        const { error } =
            await supabase
                .from("products")
                .delete()
                .eq("id",id);


        if(error){
            throw error;
        }


        showToast(
            "Producto eliminado"
        );


        await loadProducts();


    }catch(error){

        console.error(error);

        showToast(
            "No se pudo eliminar el producto"
        );

    }

}

/* =========================
   MOSTRAR PEDIDOS

function renderOrders(orders){

        document.getElementById("ordersTableBody");

                        </button>

/* =========================
   ESTADÍSTICAS
========================= */

function updateOrderStats(orders){

    const totalOrders =
        document.getElementById("totalOrders");

    const pendingOrders =
        document.getElementById("pendingOrders");

    const totalSales =
        document.getElementById("totalSales");


    if(totalOrders){

        totalOrders.textContent =
            orders.length;

    }


    const pending =
        orders.filter(
            order =>
                String(
                    order.status || "pending"
                ).toLowerCase()
                === "pending"
        );


    if(pendingOrders){

        pendingOrders.textContent =
            pending.length;

    }


    const sales =
        orders.reduce(
            (sum,order) => {

                const status =
                    String(
                        order.status || ""
                    ).toLowerCase();


                if(
                    status === "cancelled"
                ){

                    return sum;

                }


                return sum +
                    Number(
                        order.total ||
                        order.total_amount ||
                        0
                    );

            },
            0
        );


    if(totalSales){

        totalSales.textContent =
            formatPrice(sales);

    }

}

   ABRIR PEDIDO
========================= */

function openOrder(id){

        );

        order.customer_phone ||
        "—";


    document.getElementById(
        "orderAddress"
    ).textContent =

        order.delivery_address ||
        order.location ||
        "—";


    document.getElementById(
        "orderPaymentMethod"
    ).textContent =

        order.payment ||
        "—";

        "orderTotal"

/* =========================
   ITEMS
========================= */

function renderOrderItems(order){

    const container =
        document.getElementById(
            "orderItems"
        );


    let items =
        order.items ||
        order.order_items ||
        [];


    if(typeof items === "string"){

        try{

            items =
                JSON.parse(items);

        }catch(error){

            items = [];

        }

    }


    if(!Array.isArray(items) ||
       items.length === 0){

        container.innerHTML = `
            <div style="
                padding:15px;
                color:#777;
                ">
                No hay detalles de productos.
            </div>
        `;

        return;
    }


    container.innerHTML =
        items.map(item => {

            const name =
                item.name ||
                item.product_name ||
                "Producto";


            const quantity =
                item.quantity ||
                item.qty ||
                1;


            const price =
                item.price ||
                0;


            return `

                <div
                    style="
                    display:flex;
                    justify-content:space-between;
                    gap:15px;
                    padding:13px 15px;
                    border-bottom:1px solid #1d1d1d;
                    ">

                    <div>

                        <strong>
                            ${escapeHTML(name)}
                        </strong>

                        <div
                            style="
                            color:#777;
                            font-size:11px;
                            margin-top:4px;
                            ">
                            Cantidad: ${quantity}
                        </div>

                    </div>

                    <div>
                        ${formatPrice(
                            Number(price) *
                            Number(quantity)
                        )}
                    </div>

                </div>

            `;

        }).join("");

}

   COMPROBANTE
========================= */

function renderPaymentProof(order){

        document.getElementById(
            "paymentProofContainer"
        );


    const proof =
        order.payment_proof ||
        order.payment_proof_url ||
        order.proof_url ||

        container.innerHTML =
            `<span style="color:#777;">

            </span>`;

    }


    container.innerHTML = `

        <a
            href="${escapeHTML(proof)}"
            target="_blank"
            rel="noopener"
            class="btn btn-primary"
            style="

            text-decoration:none;

        document.getElementById(
            "orderModal"

<script>


/* =========================
   ACTUALIZAR ESTADO PEDIDO
========================= */

async function updateOrderStatus(){

    if(!selectedOrderId){

        showToast(
            "No hay pedido seleccionado"
        );

        return;

    }


    const newStatus =
        document.getElementById(
            "orderStatus"
        ).value;


    try{

        const { error } =
            await supabase
                .from("orders")
                .update({
                    status:newStatus
                })
                .eq(
                    "id",
                    selectedOrderId
                );


        if(error){

            throw error;

        }


        showToast(
            "Estado actualizado"
        );


        closeOrderModal();


        await loadOrders();


    }catch(error){

        console.error(
            "Error actualizando pedido:",
            error
        );


        showToast(
            "No se pudo actualizar el pedido"
        );

    }

}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

    try{

        if(
            typeof supabase !== "undefined" &&
            supabase.auth
        ){

            await supabase.auth.signOut();

        }

    }catch(error){

        console.error(error);

    }


    const admin =
        document.getElementById(
            "adminScreen"
        );


    const login =
        document.getElementById(
            "loginScreen"
        );


    if(admin){

        admin.classList.add("hidden");

    }


    if(login){

        login.classList.remove("hidden");

    }

}


/* =========================
   LOGIN
========================= */

async function loginAdmin(){

    const emailInput =
        document.getElementById(
            "adminEmail"
        );

    const passwordInput =
        document.getElementById(
            "adminPassword"
        );


    if(!emailInput || !passwordInput){

        return;

    }


    const email =
        emailInput.value.trim();


    const password =
        passwordInput.value;


    if(!email || !password){

        showToast(
            "Introduce email y contraseña"
        );

        return;

    }


    try{

        const { data,error } =
            await supabase.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        showAdminPanel();


    }catch(error){

        console.error(
            "Login error:",
            error
        );


        showToast(
            error.message ||
            "Error al iniciar sesión"
        );

    }

}


/* =========================
   MOSTRAR ADMIN
========================= */

function showAdminPanel(){

    const login =
        document.getElementById(
            "loginScreen"
        );


    const admin =
        document.getElementById(
            "adminScreen"
        );


    if(login){

        login.classList.add("hidden");

    }


    if(admin){

        admin.classList.remove("hidden");

    }


    initializeAdmin();

}


/* =========================
   COMPROBAR SESIÓN
========================= */

async function checkAdminSession(){

    try{

        const { data } =
            await supabase.auth.getSession();


        if(data && data.session){

            showAdminPanel();

        }else{

            const login =
                document.getElementById(
                    "loginScreen"
                );

            if(login){

                login.classList.remove("hidden");

            }

        }

    }catch(error){

        console.error(
            "Session error:",
            error
        );

    }

}


/* =========================
   CAMBIO DE SESIÓN
========================= */

if(
    typeof supabase !== "undefined" &&
    supabase.auth
){

    supabase.auth.onAuthStateChange(
        (event,session) => {

            if(session){

                showAdminPanel();

            }else{

                const admin =
                    document.getElementById(
                        "adminScreen"
                    );

                const login =
                    document.getElementById(
                        "loginScreen"
                    );


                if(admin){

                    admin.classList.add(
                        "hidden"
                    );

                }


                if(login){

                    login.classList.remove(
                        "hidden"
                    );

                }

            }

        }
    );

}


/* =========================
   ENTER PARA LOGIN
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            document.activeElement &&
            (
                document.activeElement.id ===
                "adminEmail" ||

                document.activeElement.id ===
                "adminPassword"
            )
        ){

            loginAdmin();

        }

    }
);


/* =========================
   CERRAR MODALES
========================= */

document.addEventListener(
    "click",
    function(event){

        const productModal =
            document.getElementById(
                "productModal"
            );


        const orderModal =
            document.getElementById(
                "orderModal"
            );


        if(
            event.target ===
            productModal
        ){

            closeProductForm();

        }


        if(
            event.target ===
            orderModal
        ){

            closeOrderModal();

        }

    }
);


/* =========================
   ARRANQUE
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        checkAdminSession();

    }
);
</script>
